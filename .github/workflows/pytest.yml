name: Run pytest
on:
  pull_request:
    branches:
      - main
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: pavelzw/pytest-action@v2
        with:
          verbose: true
          emoji: true
          job-summary: true
          custom-arguments: "-q"
          click-to-expand: true
          report-title: "Test Report"
        

